<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Preenchedor Fiscal</title>
  <style>
    body {
      width: 270px;
      font-family: Arial, sans-serif;
      padding: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12px;
      color: #555;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 6px;
    }
    button:hover {
      background: #256428;
    }
    .btn-blue {
      background: #1976d2;
    }
    .btn-blue:hover {
      background: #115293;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>Preenchedor Fiscal</h1>
  <p>Preenche informações fiscais e calcula margens no ERP.</p>
  
  <label style="display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:10px; cursor:pointer;">
    <input type="checkbox" id="importarCodigo" checked>
    Importar Código (Gtin → Código)
  </label>
  
  <button id="btnCodigoEsp" class="btn-blue">Código: 790$90030020</button>

  <hr style="border: 0; border-top: 1px solid #ccc; margin: 8px 0;">
  
  <button id="btn5102">5102 / 102 / 102</button>
  <button id="btn5405">5405 / 500 / 500</button>
  
  <hr style="border: 0; border-top: 1px solid #ccc; margin: 8px 0;">
  
  <!-- Novas Margens (Inteiro / ,50) -->
  <button id="btnMargem30Meio" class="btn-blue">Margem 30% (Inteiro / ,50)</button>
  <button id="btnMargem35Meio" class="btn-blue">Margem 35% (Inteiro / ,50)</button>

  <!-- Margens Antigas (,90) -->
  <button id="btnMargem30Antiga" class="btn-blue">Margem 30% Antiga (,90)</button>
  <button id="btnMargem35Antiga" class="btn-blue">Margem 35% Antiga (,90)</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
